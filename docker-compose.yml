version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: app_postgres
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "5432:5432"     
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-tern_backend}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    container_name: app_backend
    env_file:
      - .env        
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app               
      - /app/node_modules   
    command: ["npm","run","dev"] 

  migrate:
    build:
      context: .
      target: migrate
    container_name: app_migrate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: "no"

volumes:
  pgdata:
